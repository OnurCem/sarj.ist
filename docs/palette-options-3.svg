<rect width="1600" height="1200" fill="#faf9f7"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#252328}.title{font-size:34px;font-weight:700}.sub{font-size:16px;fill:#817b80}.name{font-size:20px;font-weight:700;letter-spacing:1px}.desc{font-size:14px;fill:#817b80}.tiny{font-size:12px;font-weight:600}.app{font-size:13px;font-weight:700}.body{font-size:12px;fill:#817b80}</style>
