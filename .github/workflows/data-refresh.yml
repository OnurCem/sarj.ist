name: Production refresh and deploy

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Fetch fresh EPDK data before deploying (disable for code-only releases)
        required: true
        default: true
        type: boolean
      bootstrap:
        description: Initialize an empty R2 state bucket (first deployment only)
        required: true
        default: false
        type: boolean
      recovery_url:
        description: Recover bootstrap state from an already validated deployment without contacting EPDK
        required: false
        default: ''
        type: string

concurrency:
  group: epdk-data-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_STATE_BUCKET: ${{ vars.CLOUDFLARE_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Restore private reconciliation state
        id: restore
        if: ${{ inputs.recovery_url == '' }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.bootstrap }}" == "true" ]]; then
            node scripts/cloudflare-state.mjs restore --bootstrap
          else
            node scripts/cloudflare-state.mjs restore
          fi

      - name: Fetch one EPDK snapshot
        if: ${{ inputs.recovery_url == '' && (github.event_name == 'schedule' || inputs.refresh_data || inputs.bootstrap) }}
        id: epdk-fetch
        run: npm run fetch:epdk

      - name: Persist the hourly fetch guard
        if: ${{ always() && steps.epdk-fetch.outcome != 'skipped' }}
        run: node scripts/cloudflare-state.mjs publish-fetch-state

      - name: Reconcile the validated snapshot
        id: reconcile
        if: ${{ inputs.recovery_url == '' && (github.event_name == 'schedule' || inputs.refresh_data || inputs.bootstrap) }}
        run: npm run import:epdk -- --input data/raw/epdk-latest.json

      - id: tests
        run: npm test
      - if: ${{ inputs.recovery_url == '' }}
        id: build
        run: npm run build
      - if: ${{ inputs.recovery_url == '' }}
        id: preflight
        run: npm run check:deployment

      - name: Deploy the complete static build
        if: ${{ inputs.recovery_url == '' }}
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke-test the deployed station data
        if: ${{ inputs.recovery_url == '' }}
        id: smoke
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: npm run smoke:deployment -- "$DEPLOYMENT_URL"

      - name: Publish validated reconciliation state
        if: ${{ inputs.recovery_url == '' }}
        id: publish
        run: node scripts/cloudflare-state.mjs publish-validated-state

      - name: Recover bootstrap state from the validated deployment
        if: ${{ inputs.recovery_url != '' }}
        env:
          RECOVERY_URL: ${{ inputs.recovery_url }}
        run: npm run recover:deployment-state -- "$RECOVERY_URL"

      - name: Publish recovered bootstrap state
        if: ${{ inputs.recovery_url != '' }}
        run: node scripts/cloudflare-state.mjs publish-validated-state

      - name: Write production refresh summary
        if: ${{ always() }}
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          FETCH_OUTCOME: ${{ steps.epdk-fetch.outcome }}
          RECONCILE_OUTCOME: ${{ steps.reconcile.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          {
            echo "## Production refresh"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Restore private state | ${RESTORE_OUTCOME} |"
            echo "| Fetch EPDK snapshot | ${FETCH_OUTCOME} |"
            echo "| Reconcile data | ${RECONCILE_OUTCOME} |"
            echo "| Tests | ${TEST_OUTCOME} |"
            echo "| Build | ${BUILD_OUTCOME} |"
            echo "| Deployment preflight | ${PREFLIGHT_OUTCOME} |"
            echo "| Deploy | ${DEPLOY_OUTCOME} |"
            echo "| Public smoke test | ${SMOKE_OUTCOME} |"
            echo "| Publish private state | ${PUBLISH_OUTCOME} |"
          } >> "$GITHUB_STEP_SUMMARY"
